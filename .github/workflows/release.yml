name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string

jobs:
  release:
    env:
      XMAKE_ROOT: "y"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: validate tag matches version.h
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          HEADER_VERSION=$(grep -oP 'KD3_VERSION_STRING\s+"\K[^"]+' include/kd3/version.h)
          if [ "$TAG_VERSION" != "$HEADER_VERSION" ]; then
            echo "error: tag v${TAG_VERSION} does not match version.h (${HEADER_VERSION})"
            exit 1
          fi
          echo "version.h matches tag v${TAG_VERSION}"

      - name: install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: build
        run: |
          export KD3_VERSION="${{ steps.version.outputs.version }}"
          xmake f -m release -y
          xmake -y kd3
          xmake -y kd3-glslgen

      - name: source tarball
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p artifacts
          tar -czf "artifacts/kd3-${V}-src.tar.gz" \
            include/kd3/ \
            LICENCE.txt \
            README.md

      - name: create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: false

      - name: bump xmake-chari-repo
        env:
          CHARI_REPO_TOKEN: ${{ secrets.CHARI_REPO_TOKEN }}
        run: |
          if [ -z "$CHARI_REPO_TOKEN" ]; then
            echo "CHARI_REPO_TOKEN not set; skipping registry bump"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: token $CHARI_REPO_TOKEN" \
            -H "Content-Type: application/json" \
            "https://git.chatomari.work/api/v1/repos/lazy-eggplant/xmake-chari-repo/actions/workflows/bump-version.yml/dispatches" \
            -d "{\"ref\":\"master\",\"inputs\":{\"package\":\"kd3\",\"version\":\"${{ steps.version.outputs.version }}\",\"sha\":\"$(git rev-parse HEAD)\"}}"
